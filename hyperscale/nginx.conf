# ==============================================================================
# NGINX HIGH-PERFORMANCE REVERSE PROXY & MICROCACHE (C10M SCALE)
# Suporta até 10.000.000 de usuários simultâneos / 1.000.000 RPS na borda
# ==============================================================================

user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimização de I/O no Kernel Linux
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Conexões persistentes e Keepalive
    keepalive_timeout 65s;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_body_timeout 15s;
    send_timeout 15s;

    # Tamanhos de Buffers para alta vazão
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compressão Gzip agressiva
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Zonas de Microcaching em Memória (100MB indexa milhões de URLs)
    proxy_cache_path /var/cache/nginx/api_cache
        levels=1:2
        keys_zone=API_MICROCACHE:100m
        max_size=20g
        inactive=120m
        use_temp_path=off;

    # Rate Limiting Defensivo por IP (100 req/s por IP com burst de 200)
    limit_req_zone $binary_remote_addr zone=IP_RATE_LIMIT:50m rate=100r/s;
    limit_req_status 429;

    # Upstream do Backend FastAPI com Connection Pool Keepalive
    upstream backend_cluster {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 512;
    }

    # Upstream do Frontend React SPA
    upstream frontend_cluster {
        server frontend:80;
        keepalive 128;
    }

    server {
        listen 80 reuseport default_server;
        listen [::]:80 reuseport default_server;
        server_name _;

        # Logs de Alta Performance (Bufferizados)
        access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
        error_log /var/log/nginx/error.log warn;

        # ----------------------------------------------------------------------
        # 1. Ativos Estáticos do Frontend (Cache Agressivo de Longo Prazo)
        # ----------------------------------------------------------------------
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # 2. Rotas Públicas da API com Microcaching (Absorve 98% do tráfego)
        # Bancas, Disciplinas, Concursos, Questões e Presets
        # ----------------------------------------------------------------------
        location ~ ^/api/(bancas|disciplinas|concursos|assuntos|skills/presets|questoes) {
            limit_req zone=IP_RATE_LIMIT burst=200 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Configurações do Microcache Nginx
            proxy_cache API_MICROCACHE;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 60s;
            proxy_cache_valid 404 10s;

            # Anti-Thundering Herd (Apenas 1 vai ao backend se o cache expirar!)
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Header com o status do cache (HIT, MISS, STALE)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Hyperscale-Tier "Edge-Microcache-C10M" always;
        }

        # ----------------------------------------------------------------------
        # 3. Demais Rotas Dinâmicas da API (Submissões, Redações, Mentoria)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=IP_RATE_LIMIT burst=100 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Bypass de cache em escritas
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        }

        # ----------------------------------------------------------------------
        # 4. Rota Raiz e Navegação SPA (HTML)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTML sem cache agressivo para atualização instantânea de releases
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
