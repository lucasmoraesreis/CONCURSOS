# ==============================================================================
# PGBOUNCER TRANSACTION POOLING CONFIGURATION (C10M SCALE)
# Permite que 10.000 pods/workers FastAPI compartilhem 100 conexões reais com PostgreSQL
# ==============================================================================

[databases]
questoes_concursos = host=postgres port=5432 dbname=questoes_concursos auth_user=questoes_admin

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Modo de pooling: 'transaction' garante reaproveitamento imediato após cada query/transação
pool_mode = transaction

# Conexões máximas de clientes aceitas pelo PgBouncer (lado da API)
max_client_conn = 50000

# Conexões reais com o PostgreSQL (lado do banco)
default_pool_size = 50
min_pool_size = 20
reserve_pool_size = 20
reserve_pool_timeout = 2
max_db_connections = 150

# Timeouts defensivos
server_idle_timeout = 60
client_idle_timeout = 60
query_timeout = 10
query_wait_timeout = 15
server_connect_timeout = 5

# Otimizações de rede
tcp_defer_accept = 1
tcp_socket_buffer = 131072
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10
