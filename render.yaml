# ==============================================================================
# Render.com Blueprint — Deploy Automático na Camada Gratuita (Free Tier)
# ==============================================================================

databases:
  - name: qconcursos-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: qconcursos-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qconcursos-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: qconcursos-frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: qconcursos-backend
          property: url
