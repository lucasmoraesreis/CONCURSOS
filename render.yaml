# ==============================================================================
# Render.com Blueprint — Infraestrutura como Código (IaC)
# Deploy 100% GRATUITO (Free Tier): PostgreSQL 16 + FastAPI Docker + React Docker
# ==============================================================================

databases:
  - name: qconcursos-db
    databaseName: questoes_concursos
    user: questoes_admin
    plan: free
    postgresMajorVersion: 16
    ipAllowList: [] # Permite conexões internas seguras da Render

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API (FastAPI + Uvicorn + Alembic auto-migrations via Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: qconcursos-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qconcursos-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
        generate: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8000

  # ----------------------------------------------------------------------------
  # 2. Frontend UI (React + Vite SPA servido via Nginx Alpine Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: qconcursos-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: qconcursos-backend
          property: host
      - key: PORT
        value: 80
